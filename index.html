<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和弦作曲助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&family=Kalam:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a lead sheet on a page — title block, then one system per 4 bars with chord symbols above a faint staff and lyrics below; controls sit in the margins of each section. */
:root{
  --bg:#e7eae7; --paper:#fdfdfb; --sunk:#eef1ee; --ink:#151a17; --muted:#5d6761; --line:#d3d9d5; --staff:#a3aca6; --line-strong:#87918b;
  --accent:#1e6a56; --accent-ink:#ffffff; --surface:#fdfdfb;
  --fT:#3c9775; --fS:#d6922a; --fD:#d1543d; --fB:#7a5ed0; --hl:#fff0b8;
  --font-d:'Bricolage Grotesque','Noto Sans TC',system-ui,sans-serif;
  --font-c:'Kalam','Bricolage Grotesque','Noto Sans TC',cursive;
  --font-b:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1311; --paper:#191e1b; --sunk:#222924; --ink:#e5ebe7; --muted:#9aa59e; --line:#2c342f; --staff:#56625b; --line-strong:#76837b;
    --accent:#6cc3a3; --accent-ink:#0e1914; --surface:#191e1b; --fT:#5cc09a; --fS:#e8ae4c; --fD:#ec7860; --fB:#a18cf0; --hl:#3a3317; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1311; --paper:#191e1b; --sunk:#222924; --ink:#e5ebe7; --muted:#9aa59e; --line:#2c342f; --staff:#56625b; --line-strong:#76837b;
  --accent:#6cc3a3; --accent-ink:#0e1914; --surface:#191e1b; --fT:#5cc09a; --fS:#e8ae4c; --fD:#ec7860; --fB:#a18cf0; --hl:#3a3317; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;padding:16px 0 104px}
.page{max-width:780px;margin:0 auto;padding:0 12px;display:flex;flex-direction:column;gap:14px}
.paper{background:var(--paper);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.06);padding:22px 18px 28px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 11px;font-size:14px;line-height:1.3}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:4px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:0}
/* title block */
.tb{display:flex;flex-direction:column;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
#title{font-family:var(--font-d);font-size:28px;font-weight:700;text-align:center;border:0;background:none;border-bottom:1px dashed transparent;border-radius:0;width:100%;max-width:520px;padding:2px 4px}
#title:hover,#title:focus{border-bottom-color:var(--line-strong)}
#title::placeholder{color:var(--muted);opacity:.7}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center;font-size:13.5px;color:var(--muted)}
.meta label{display:flex;align-items:center;gap:6px}
.meta input[type=number]{width:64px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--sunk);padding:4px 10px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
.capohint{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.capohint[disabled]{color:var(--muted);text-decoration:none;cursor:default}
/* mood */
.mood{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:22px;display:flex;flex-direction:column;gap:10px}
.mood.need{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--paper))}
.mood[hidden]{display:none}
.mood h2{margin:0;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 8px;text-align:left}
.chip b{display:block;font-size:13.5px}
.chip small{color:var(--muted);font-family:var(--font-m);font-size:10.5px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--paper));box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* score */
.empty-score{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.empty-score svg{width:100%;height:46px}
.part{margin-bottom:26px}
.part.playing .mark{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.mark{font-family:var(--font-d);font-weight:700;font-size:15px;border:2px solid var(--ink);border-radius:4px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.pname{font-family:var(--font-d);font-weight:700;font-size:18px}
.ph select{font-size:12.5px;padding:3px 6px}
.ph .sp{flex:1}
.tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tools .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:7px;min-width:30px;height:30px;padding:0 7px;font-size:13px}
.ib.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ib.warn{color:var(--fD)}
.tools .gap{flex:1}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}
.meas{position:relative;display:flex;flex-direction:column;border-right:1.5px solid var(--ink);min-width:0;transition:background .2s}
.hit{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;border-radius:0;position:relative}
.hit.pressing{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.meas.flash{background:color-mix(in srgb,var(--hl) 80%,transparent)}
input.lyin{width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;border-radius:0;font-size:12.5px;padding:3px 6px;margin-top:2px;color:var(--ink)}
input.lyin::placeholder{color:var(--muted);opacity:.45}
input.lyin:hover{border-bottom-color:var(--line)}
input.lyin:focus{outline:none;border-bottom-color:var(--accent);background:var(--sunk)}
.junc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-12px 0 18px;padding:5px 8px;border-left:3px solid var(--fT);background:color-mix(in srgb,var(--fT) 6%,transparent)}
.junc .jv{font-weight:700;color:var(--fT)}
.junc.bad{border-left-color:var(--fD);background:color-mix(in srgb,var(--fD) 9%,transparent)}
.junc.bad .jv{color:var(--fD)}
.junc .sp{flex:1}
.ib.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.meas.first{border-left:1.5px solid var(--ink)}
.meas.end{border-right:5px double var(--ink)}
.meas .chd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 6px;padding:0 6px;min-height:30px}
.meas .one{display:flex;align-items:flex-end;gap:4px}
.meas .nm{font-family:var(--font-c);font-size:21px;line-height:1;white-space:nowrap;border-bottom:3px solid var(--fc,transparent);padding-bottom:1px}
.meas.two .nm{font-size:17px}
.meas .rm{font-family:var(--font-m);font-size:10px;color:var(--muted);white-space:nowrap}
.meas .dg svg{display:block}
.meas .staff{display:block;width:100%;height:36px;margin-top:4px}
.meas .ly{font-size:12.5px;padding:3px 6px 0;min-height:21px;line-height:1.35;overflow-wrap:anywhere}
.meas .ly.ph2{color:var(--muted);opacity:.55}
.meas .lk{position:absolute;top:0;right:4px;width:12px;height:12px;color:var(--muted)}
.meas .unsure{position:absolute;top:0;right:18px;font-family:var(--font-d);font-weight:700;font-size:12px;color:var(--fD)}
.meas .cap{font-family:var(--font-m);font-size:9.5px;color:var(--muted);padding:0 6px}
.meas.playing{background:var(--hl)}
.hit:hover{background:color-mix(in srgb,var(--hl) 40%,transparent)}
.meas.blank .nm{color:var(--muted);opacity:.4}
.bor{--fc:var(--fB)}
.f-T{--fc:var(--fT)} .f-S{--fc:var(--fS)} .f-D{--fc:var(--fD)}
.meas .nm.bor{border-bottom-style:dashed}
.addbar{border-top:1px dashed var(--line-strong);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.addbar h2{margin:0;font-size:14px}
.addbtns{display:flex;flex-wrap:wrap;gap:6px}
.addbtns button{border:1px dashed var(--line-strong);background:none;border-radius:999px;padding:5px 12px;font-size:13.5px}
.addbtns .recb{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:700}
.badge{font-size:11.5px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 8px}
.steps{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.roll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.roll canvas{display:block}
.cand.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pickbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:12px;padding:1px 8px;margin-bottom:4px}
.cand.sel .pickbtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.warnt{color:var(--fD)}
input[type=file]{font-size:13px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.qc{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.qc b{font-family:var(--font-c);font-size:18px;font-weight:700;line-height:1.1}
.qc small{font-family:var(--font-m);font-size:10px;color:var(--muted)}
.qc.qb{border-style:dashed}
.qc.on,.rt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qc.on small{color:inherit;opacity:.75}
.rgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.rt{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 2px;font-size:13px;color:var(--muted)}
.rt.dia{background:var(--sunk);color:var(--ink);font-weight:700}
.rt.dia.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pbar{position:sticky;top:-16px;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--fc);border-radius:10px;padding:8px 10px;box-shadow:0 6px 12px -8px rgba(0,0,0,.25)}
.pbar .pinfo{flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px}
.pbar .big{font-family:var(--font-c);font-size:28px;line-height:1}
.pbar .big small{font-family:var(--font-m);font-size:11px;color:var(--muted);margin-left:6px}
.pbar .fb{font-size:12px;color:var(--muted)}
.pbar .pact{display:flex;flex-direction:column;gap:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle;background:var(--c)}
.overview{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12.5px;color:var(--muted);justify-content:center}
.overview a{color:var(--ink);text-decoration:none;background:var(--sunk);border-radius:5px;padding:1px 7px}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .now{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .bd{position:absolute;inset:0;background:rgba(10,15,12,.45)}
.sheet .pn{position:relative;background:var(--paper);width:100%;max-width:780px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sh-top{display:flex;align-items:center;gap:8px}
.sh-top .t{flex:1;font-size:13px;color:var(--muted)}
.sh-chords{display:flex;gap:16px;flex-wrap:wrap}
.sh-ch{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:250px}
.sh-ch .big{font-family:var(--font-c);font-size:36px;line-height:1}
.sh-ch .meta2{display:flex;flex-direction:column;gap:6px}
.sh-ch .rm{font-family:var(--font-m);font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:color-mix(in srgb,var(--fc) 20%,transparent);border:1px solid color-mix(in srgb,var(--fc) 55%,transparent)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--sunk);border-radius:6px;padding:1px 7px}
.vnav{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.vnav button{border:1px solid var(--line);background:var(--sunk);border-radius:7px;width:28px;height:26px}
.frets{font-family:var(--font-m);font-size:12px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f input{padding:8px 10px;font-size:15px}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px}
.tabs button{border:0;background:none;padding:8px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
.feels{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:13.5px}
.tg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk)}
.cand .m{flex:1;min-width:0}
.cand .nm{font-family:var(--font-c);font-size:20px}
.cand .nm small{font-family:var(--font-m);font-size:11px;color:var(--muted);margin-left:6px}
.cand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dots{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cand .a{display:flex;gap:6px}
.empty{font-size:13.5px;color:var(--muted);padding:8px 2px}
.nov{font-size:10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 10px 8px 14px;border-radius:9px;font-size:13.5px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:10px;align-items:center;max-width:92vw}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:2px 4px}
.toast:not(.act) button{display:none}
textarea{width:100%;min-height:220px;font-family:var(--font-m);font-size:12.5px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}
@media (max-width:520px){.tools .lbl{display:none}.tools .gap{flex:0 0 4px}.ib{min-width:28px;padding:0 6px}.paper{padding:18px 10px 24px}.meas .nm{font-size:19px}.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
  <main class="paper" id="paper">
    <div class="tb">
      <input id="title" type="text" placeholder="未命名歌曲" aria-label="歌名" autocomplete="off">
      <div class="meta">
        <label for="key">調 <select id="key"></select></label>
        <label for="bpm">♩ = <input id="bpm" type="number" min="50" max="190"></label>
        <label for="capo">移調夾 <select id="capo"></select></label>
        <span class="seg" id="instr" role="group" aria-label="試聽音色"><button type="button" data-v="guitar">吉他</button><button type="button" data-v="piano">鋼琴</button></span>
        <span class="seg" id="diagT" role="group" aria-label="按法圖"><button type="button" data-v="1">按法圖</button><button type="button" data-v="0">隱藏</button></span>
      </div>
      <button type="button" class="capohint" id="capoHint"></button>
      <div class="overview" id="overview"></div>
    </div>
    <section class="mood" id="mood" aria-labelledby="h-mood"></section>
    <div id="score"></div>
    <div class="addbar">
      <h2 id="addTitle">新增段落</h2>
      <div class="addbtns" id="addBtns"></div>
      <div class="legend" aria-label="和弦下方色線說明">
        <span style="--c:var(--fT)"><i></i>主：穩定</span><span style="--c:var(--fS)"><i></i>下屬：離開</span><span style="--c:var(--fD)"><i></i>屬：緊張</span><span style="--c:var(--fB)"><i style="background:repeating-linear-gradient(90deg,var(--fB) 0 4px,transparent 4px 7px)"></i>借用和弦</span>
      </div>
    </div>
  </main>
  <p class="hint" style="text-align:center">單擊和弦試聽，長按打開詳情（自選和弦、換和弦、看按法）；歌詞直接在譜上輸入，按 Enter 跳下一小節。設定會存在這個瀏覽器裡。</p>
</div>

<div class="bar"><div class="in">
  <button class="btn pri" id="playAll" type="button">▶ 播放全曲</button>
  <span class="now" id="now"></span>
  <button class="btn" id="copy" type="button">複製和弦譜</button>
</div></div>

<div class="sheet" id="sheet" hidden>
  <div class="bd" data-act="close"></div>
  <div class="pn" id="sheetPn" role="dialog" aria-modal="true" aria-label="小節詳情"></div>
</div>
<div class="sheet" id="copyDlg" hidden>
  <div class="bd" data-act="closecopy"></div>
  <div class="pn">
    <div class="sh-top"><div class="t">無法自動複製，請長按全選後複製</div><button class="btn sm" data-act="closecopy" type="button">關閉</button></div>
    <textarea id="copyText" readonly></textarea>
  </div>
</div>
<div class="sheet" id="recDlg" hidden>
  <div class="bd" data-act="recclose"></div>
  <div class="pn" id="recPn" role="dialog" aria-modal="true" aria-label="從哼唱錄音產生和弦"></div>
</div>
<div class="toast" id="toast" role="status"><span id="toastT"></span><button type="button" id="toastB">復原</button></div>
<script>
'use strict';
/* ---------- 樂理資料 ---------- */
const NOTE_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_F=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];

const vcache={};
function voicingsFor(pc,q){
  const key=pc+'|'+q; if(vcache[key])return vcache[key];
  const out=[]; const seen=new Set();
  const push=v=>{const s=v.frets.join(',');if(!seen.has(s)){seen.add(s);out.push(v);}};
  (OPENMAP[key]||[]).forEach(push);
  const add=(sh,r,label)=>{ if(!sh)return; if(r<1||r>9)return;
    const frets=sh[0].map(o=>o===null?-1:r+o); if(frets.some((f,i)=>sh[0][i]!==null&&f<0))return;
    const d=(q==='dim'||q==='dim7')?3:2; push({frets,fingers:sh[1].slice(),d,label:`第 ${Math.min(...frets.filter(f=>f>0))} 格`});};
  add(ESH[q],(pc-4+12)%12,'E'); add(ASH[q],(pc-9+12)%12,'A');
  // 簡易按法（d=1.5）排在標準按法後面，只在「更好彈」裡提供
  out.forEach(v=>{v.simple=v.d===1.5;});
  out.sort((a,b)=>(a.simple-b.simple)||a.d-b.d||Math.max(...a.frets)-Math.max(...b.frets));
  vcache[key]=out; return out;
}

const mod=n=>((n%12)+12)%12;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inst(id,q){const L=LIB[id];return {lib:id,r:L.r,q:q||L.q,vi:0};}
function vq(X,q){return Object.assign({},X,{q,vi:0});}
const libOf=c=>c&&c.lib?LIB[c.lib]:null;
const fn=c=>{const L=libOf(c);return L?L.f:(c.f||'D');};
const kindOf=c=>{const L=libOf(c);return L?L.type:'pass';};
const tension=c=>{const L=libOf(c);let t=L?L.t:4;if(c.q==='sus4')t+=.5;return t;};
const tones=c=>Q[c.q].iv.map(i=>mod(c.r+i));
function romanOf(c){const L=libOf(c);const base=L?L.roman:c.roman;const def=L?L.q:c.q;if(L&&c.q==='m7b5'&&c.q!==def)return base.replace('°','')+'ø7';if(c.q===def||(L&&L.type==='sec'))return base;return base+(ROMSUF[c.q]||'');}
function resOf(c){const L=libOf(c);if(L&&L.type==='sec')return mod(L.r+5);return c.res;}
function generic(a,b){let s=2;const d=mod(b.r-a.r);if(d===5)s+=2;else if(d===8||d===9)s+=1;else if(d===1||d===2)s+=1;
  const tb=tones(b);let c=0;tones(a).forEach(x=>{if(tb.includes(x))c++;});s+=Math.min(1,c*.5);if(fn(a)==='D'&&fn(b)!=='T')s-=1;return clamp(s,0,5);}
function T(a,b){if(!a||!b)return 3;const ra=resOf(a);if(ra!==undefined)return b.r===ra?5:1;
  if(a.lib&&b.lib){if(a.lib===b.lib)return a.q===b.q?2:3;const A=a.lib,B=b.lib;if(TT[A]&&TT[A][B]!==undefined)return TT[A][B];const k=A+'>'+B;if(SPECIAL[k]!==undefined)return SPECIAL[k];}
  return generic(a,b);}
const same=(a,b)=>a&&b&&a.r===b.r&&a.q===b.q;

function prefOf(c,k){const L=libOf(c);if((L&&L.roman.startsWith('♭'))||c.flat)return 'flat';if(c.sharp)return 'sharp';return FLATKEYS.has(k)?'flat':'sharp';}

function weightFn(moodId,subId){
  const m=MOODS.find(x=>x.id===moodId)||null,s=subId?MOODS.find(x=>x.id===subId):null;
  const w1=(mood,id)=>{const base=LIB[id].type==='dia'?1:.55;if(!mood)return base;if(mood.boost.includes(id))return 1.5;if(mood.reduce.includes(id))return .5;return base;};
  return id=>s?(.7*w1(m,id)+.3*w1(s,id)):w1(m,id);
}
function beam(sec,opt){
  const L=sec.len,pool=Object.keys(LIB),W=opt.w;
  const run=strict=>{
    let beams=[{path:[],score:0}];
    for(let i=0;i<L;i++){
      const target=sec.t[0]+(sec.t[1]-sec.t[0])*(L===1?0:i/(L-1));
      const nx=[];
      for(const b of beams){
        const pc=b.path.length?b.path[b.path.length-1]:null;
        const prev=pc?pc.chords[pc.chords.length-1]:opt.prevEnd;
        const locked=opt.locked[i];
        const cands=locked?[locked]:pool.map(id=>({chords:[inst(id)],locked:false,lyric:''}));
        for(const cell of cands){
          const c=cell.chords[0];
          if(!locked&&strict){
            if(i===0&&!opt.start.includes(c.lib))continue;
            if(i===L-1&&!sec.end.includes(c.lib))continue;
            if(prev&&resOf(prev)!==undefined&&c.r!==resOf(prev))continue;
            if(i===L-1&&kindOf(c)==='sec')continue;
          }
          const t=prev?T(prev,c):3;
          if(strict&&!locked&&prev&&t<(i===0?3:1.5))continue;
          let jn=0;
          if(i===L-1&&opt.nextStart){const tn=T(cell.chords[cell.chords.length-1],opt.nextStart);if(strict&&!locked&&tn<3)continue;jn=tn*.8;}
          let rep=0;const p=b.path;
          if(p.length&&same(p[p.length-1].chords[0],c))rep+=.7;
          if(p.length>1&&same(p[p.length-1].chords[0],c)&&same(p[p.length-2].chords[0],c))rep+=1;
          rep+=p.filter(x=>same(x.chords[0],c)).length*(opt.fit?.15:.6);
          if(kindOf(c)==='bor'&&p.some(x=>kindOf(x.chords[0])==='bor'))rep+=2.5;
          const E=c.lib?(opt.fit?1+(W(c.lib)-1)*.4:W(c.lib)):1;
          const F=opt.fit?5*fitScore(c,opt.fit[i]):0;
          let cad=0;if(opt.fit&&!locked){if(kindOf(c)==='sec')cad-=.8;if(c.lib==='iii')cad-=.25;if(i===0&&!opt.prevEnd)cad+=c.lib==='I'?.6:c.lib==='vi'?.2:0;if(i===L-1)cad+=c.lib==='I'?1.8:c.lib==='V'?.4:0;else if((i+1)%4===0)cad+=(c.lib==='I'||c.lib==='V')?.8:(c.lib==='vi'||c.lib==='IV')?.2:0;}
          const s=t*E*(opt.fit?.55:1)+jn+F+cad-(opt.fit?.3:.8)*Math.abs(tension(c)-target)-rep,noise=Math.random()*opt.temp;
          nx.push({path:[...p,locked?locked:cell],score:b.score+s+noise,clean:(b.clean||0)+s});
        }
      }
      nx.sort((a,b)=>b.score-a.score);beams=nx.slice(0,24);
      if(!beams.length)return null;
    }
    return beams;
  };
  return run(true)||run(false);
}
function diverse(list,n){
  const out=[];
  for(const b of list){
    if(out.every(o=>o.path.filter((c,i)=>!same(c.chords[0],b.path[i].chords[0])).length>=Math.min(2,b.path.length)))out.push(b);
    if(out.length===n)break;
  }
  return out.length?out:list.slice(0,1);
}

  let start=base.start||['I'];
  if(part.type==='verse')start=mood.start.concat(['I','vi']).filter((x,i,a)=>a.indexOf(x)===i).slice(0,2);
  if(part.type==='intro'){start=[firstLibOfType('verse',uid),firstLibOfType('chorus',uid)].filter(Boolean);if(!start.length)start=mood.start.concat(['I']).filter((x,i,a)=>a.indexOf(x)===i);}
  if(part.type==='chorus'){const vf=firstLibOfType('verse',uid);const f=start.filter(x=>x!==vf);if(f.length)start=f;}
  if(part.type==='bridge'){const used=new Set();state.parts.forEach(p=>{if((p.type==='verse'||p.type==='chorus')&&cellsOf(p))cellsOf(p).forEach(c=>c.chords.forEach(ch=>used.add(ch.lib)));});
    start=['vi','ii','iii','iv','bVI','bVII','IV'].filter(x=>!used.has(x));if(!start.length)start=['vi','ii'];}
  if(part.fit){const any=Object.keys(LIB).filter(id=>LIB[id].type!=='sec');start=any;sec.end=any;}
  const w=weightFn(moodId,part.mood?'':state.sub);
  const runs=[];for(let k=0;k<3;k++){const b=beam(sec,{w,start,prevEnd:prevChordBefore(idx),nextStart:nextChordAfter(idx),locked,temp:part.fit?(k===0?0:.5):1.3,fit:part.fit});if(b)runs.push(...b.slice(0,8));}
  runs.sort(part.fit?(a,b)=>b.clean-a.clean:(a,b)=>b.score-a.score);
  const picks=diverse(runs,3);
  const lyrics=old?old.map(c=>c.lyric):(part.lyrics||[]);delete part.lyrics;
  part.options=picks.map(p=>p.path.map((c,i)=>({chords:JSON.parse(JSON.stringify(c.chords)),locked:!!c.locked,lyric:lyrics[i]||''})));
  if(part.fit)part.options.forEach(o=>refineFit(o,part.fit,prevChordBefore(idx),nextChordAfter(idx)));
  part.pick=0;
}
function copyFrom(src,dst){
  const lyr=cellsOf(dst)?cellsOf(dst).map(c=>c.lyric):(dst.lyrics||[]);delete dst.lyrics;
  dst.len=src.len;dst.options=JSON.parse(JSON.stringify(src.options));dst.pick=src.pick;
  dst.options.forEach(o=>o.forEach((c,i)=>{c.lyric=lyr[i]||'';c.locked=false;}));
}
function joinOK(idx){const p=state.parts[idx],c=cellsOf(p);if(!c)return true;const a=prevChordBefore(idx);return !a||T(a,c[0].chords[0])>=3;}
function genAll(keepLocks){
  // 依歌曲順序產生：每段開頭參考前一段結尾；同名段落沿用，但接縫不順就重新產生
  state.parts.forEach(p=>{const c=cellsOf(p);if(c&&!(keepLocks&&c.some(x=>x.locked))){p.lyrics=c.map(x=>x.lyric);p.options=[];p.pick=0;}});
  const done={};
  state.parts.forEach((p,idx)=>{
    const hasLock=cellsOf(p)&&cellsOf(p).some(c=>c.locked);
    const src=done[p.type];
    if(src&&!hasLock&&!p.mood&&!src.mood&&!p.fit&&!src.fit&&src.len===p.len){copyFrom(src,p);if(!joinOK(idx))genPart(p.uid,keepLocks);}
    else genPart(p.uid,keepLocks);
    if(!done[p.type]&&!p.fit)done[p.type]=p;

}

function diagram(v,W,nums){
  if(!v)return '<span class="nov">按法待補</span>';
  const fr=v.frets,fi=v.fingers,pos=fr.filter(f=>f>0);
  const max=pos.length?Math.max(...pos):0,min=pos.length?Math.min(...pos):1,base=max<=4?1:min,NF=4;
  const px=W*.17,top=W*.27,gx=(W-2*px)/5,gy=gx*1.12,H=top+gy*NF+W*.05,r=gx*.38;
  let s=`<svg viewBox="0 0 ${W} ${H.toFixed(1)}" width="${W}" height="${H.toFixed(1)}" aria-hidden="true">`;
  for(let i=0;i<=NF;i++){const y=top+i*gy;s+=`<line x1="${px}" x2="${W-px}" y1="${y}" y2="${y}" stroke="var(--line-strong)" stroke-width="${i===0&&base===1?Math.max(2,W*.035):.8}"/>`;}
  for(let i=0;i<6;i++){const x=px+i*gx;s+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+NF*gy}" stroke="var(--line-strong)" stroke-width=".8"/>`;}
  if(base>1)s+=`<text x="${px-2}" y="${top+gy*.7}" text-anchor="end" font-size="${(W*.16).toFixed(1)}" fill="var(--muted)" font-family="JetBrains Mono,monospace">${base}</text>`;
  const bars={};fr.forEach((f,i)=>{if(f>0&&fi[i]===1)(bars[f]=bars[f]||[]).push(i);});
  const barDone={};
  Object.keys(bars).forEach(f=>{const a=bars[f];if(a.length>1){const i0=Math.min(...a),i1=Math.max(...a),y=top+(f-base+.5)*gy;
    s+=`<rect x="${px+i0*gx-r}" y="${y-r}" width="${(i1-i0)*gx+2*r}" height="${2*r}" rx="${r}" fill="var(--ink)"/>`;
    if(nums)s+=`<text x="${px+i0*gx}" y="${y+r*.45}" text-anchor="middle" font-size="${(r*1.25).toFixed(1)}" font-weight="700" fill="var(--paper)">1</text>`;barDone[f]=true;}});
  fr.forEach((f,i)=>{const x=px+i*gx;
    if(f<0)s+=`<text x="${x}" y="${top-W*.06}" text-anchor="middle" font-size="${(W*.16).toFixed(1)}" fill="var(--muted)">×</text>`;
    else if(f===0)s+=`<circle cx="${x}" cy="${top-W*.1}" r="${(W*.045).toFixed(1)}" fill="none" stroke="var(--muted)" stroke-width="1"/>`;
    else{const y=top+(f-base+.5)*gy;if(barDone[f]&&fi[i]===1)return;
      s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--ink)"/>`;
      if(nums&&fi[i]>0)s+=`<text x="${x}" y="${y+r*.45}" text-anchor="middle" font-size="${(r*1.25).toFixed(1)}" font-weight="700" fill="var(--paper)">${fi[i]}</text>`;}});
  return s+'</svg>';
}
const fretText=v=>v?v.frets.map(f=>f<0?'x':f).join(' '):'';

/* ---------- 聲音：溫暖的撥弦 + 箱體共鳴 + 殘響 ---------- */
let ctx=null,master=null,sources=[],timers=[],playing=false;
function ac(){
  if(!ctx){const C=window.AudioContext||window.webkitAudioContext;ctx=new C();
    master=ctx.createGain();master.gain.value=.85;
    const body=ctx.createBiquadFilter();body.type='peaking';body.frequency.value=190;body.Q.value=1.1;body.gain.value=4;
    const low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=320;low.gain.value=2;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2300;lp.Q.value=.5;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
    const rev=ctx.createConvolver();const len=Math.floor(ctx.sampleRate*1.8),ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    rev.buffer=ir;const wet=ctx.createGain();wet.gain.value=.22;
    master.connect(body);body.connect(low);low.connect(lp);lp.connect(comp);lp.connect(rev);rev.connect(wet);wet.connect(comp);comp.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume();return ctx;
}
const ks={};
function pluckBuf(midi){
  if(ks[midi])return ks[midi];
  const sr=ctx.sampleRate,f=440*Math.pow(2,(midi-69)/12),N=Math.max(3,Math.round(sr/f-1)),len=Math.floor(sr*3);
  const buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  // 柔軟的激發：雜訊先低通兩次，模擬用指腹或軟彈片撥弦
  for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
  for(let pass=0;pass<3;pass++){let p=d[N-1];for(let i=0;i<N;i++){p=.6*p+.4*d[i];d[i]=p;}}
  let mx=0;for(let i=0;i<N;i++)mx=Math.max(mx,Math.abs(d[i]));for(let i=0;i<N;i++)d[i]/=mx||1;
  const decay=.9965-Math.max(0,midi-52)*.00018;
  for(let i=N;i<len;i++)d[i]=decay*(.3*d[i-N]+.45*d[i-N+1]+.25*d[i-N+2<i?i-N+2:i-N]);
  ks[midi]=buf;return buf;
}
function pluck(midi,t,vel,dur){
  const s=ctx.createBufferSource();s.buffer=pluckBuf(midi);const g=ctx.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.004);g.gain.setValueAtTime(vel,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+.12);
  s.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.15);sources.push(s);
}
function tone(midi,t,dur,vel){
  const f=440*Math.pow(2,(midi-69)/12),g=ctx.createGain();
  [['triangle',1,.5],['sine',2,.12]].forEach(([type,mult,gv])=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f*mult;const og=ctx.createGain();og.gain.value=gv;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.4);sources.push(o);});
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel*.32,t+.01);g.gain.exponentialRampToValueAtTime(vel*.1,t+Math.min(1.2,dur));g.gain.linearRampToValueAtTime(0,t+dur+.35);
  g.connect(master);
}
const OPENS=[40,45,50,55,59,64];
function playChord(c,t,dur,vel,up){
  if(state.inst==='guitar'){const v=curV(c);if(v){
    const strs=v.frets.map((f,i)=>f<0?null:{m:OPENS[i]+f+state.capo,i}).filter(Boolean);
    const ord=up?strs.slice().reverse().slice(0,4):strs;
    ord.forEach((x,k)=>{const string=x.i;const sv=vel*(up?.45:1)*(1-string*.06);pluck(x.m,t+k*(up?.016:.028),sv*1.25,dur);});return;}}
  const root=mod(state.key+c.r);let bass=36+root;if(bass<40)bass+=12;
  tone(bass,t,dur,vel*.9);
  Q[c.q].iv.forEach(i=>{let n=60+mod(root+i);if(n>71)n-=12;tone(n,t,dur,vel*.75);});
}
function stopAll(){
  sources.forEach(s=>{try{s.stop();}catch(e){}});sources=[];timers.forEach(clearTimeout);timers=[];playing=false;
  document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));

function playCells(list){
  stopAll();if(!list.length)return;const c=ac();playing=true;document.getElementById('playAll').textContent='■ 停止';

  list.forEach(it=>{
    const n=it.cell.chords.length,span=4/n*beat;
    it.cell.chords.forEach((ch,j)=>{const st=t+j*span;
      if(state.inst==='guitar'){playChord(ch,st,span,.9,false);if(n===1){playChord(ch,st+2*beat,beat,.6,false);playChord(ch,st+3*beat,beat,.5,true);}else playChord(ch,st+beat,beat,.5,true);}
      else playChord(ch,st,span,.9,false);});
    timers.push(setTimeout(()=>highlight(it),(t-c.currentTime)*1000));t+=4*beat;});
  timers.push(setTimeout(stopAll,(t-c.currentTime)*1000+200));
}
function playSeq(chords){
  stopAll();const c=ac();playing=true;document.getElementById('playAll').textContent='■ 停止';

function noteIn(pc,X){const k=shapeKey();return (prefOf(X,k)==='flat'?NOTE_F:NOTE_S)[mod(k+pc)];}
function easyCands(uid,i){
  // 只有封閉和弦（目前按法要橫按）才找替代：簡易按法、或共用至少 2 個音的開放和弦
  const cell=cellsOf(pOf(uid))[i],nb=neighbors(uid,i),out=[];
  cell.chords.forEach((X,j)=>{
    if(!isBarre(X))return;
    const tag=cell.chords.length>1?`（換第 ${j+1} 個和弦）`:'';
    const swap=y=>cell.chords.map((c,k)=>k===j?y:c);
    vlist(X).forEach((v,k)=>{if(v.simple)out.push(mk(`${chordName(X)}　簡易按法 ${fretText(v).replace(/ /g,'')}`,swap(Object.assign({},X,{vi:k})),'和弦不變，只彈 4 條弦，不用整排橫按'+tag,1));});
    const pre=j>0?cell.chords[j-1]:nb.P,nxt=j<cell.chords.length-1?cell.chords[j+1]:nb.N,xs=tones(X),seen=new Set(),subs=[];
    Object.keys(LIB).forEach(id=>{const L=LIB[id],qs=[L.q];if(L.q==='maj')qs.push('maj7','sus2','add9');if(id==='V')qs.push('7');if(L.q==='min')qs.push('m7');if(id==='ii')qs.push('m7b5');
      qs.forEach(q=>{const Y=Object.assign(inst(id),{q});const key=Y.r+'|'+q;if(same(Y,X)||seen.has(key))return;seen.add(key);
        if(diffOf(Y)!==1)return;const ys=tones(Y),common=xs.filter(t=>ys.includes(t));if(common.length<2)return;
        const tp=pre?T(pre,Y):3,tn=nxt?T(Y,nxt):3;if(tp<2||tn<2.5)return;
        const sc=common.length*1.2+(fn(Y)===fn(X)?1:0)+(Y.r===X.r&&Q[Y.q].iv[1]===Q[X.q].iv[1]?1.5:0)+(tp+tn)*.3+(kindOf(Y)==='dia'?.3:0);
        subs.push({sc,c:mk(chordName(Y),swap(Y),`跟 ${chordName(X)} 共用 ${common.map(pc=>noteIn(pc,X)).join('、')} ${common.length} 個音，聽起來接近，不用橫按${tag}`,1)});});});
    subs.sort((a,b)=>b.sc-a.sc);subs.slice(0,4).forEach(x=>out.push(x.c));
  });
  return out;
}

function playJoint(au,bu){const a=pOf(au),b=pOf(bu),ca=cellsOf(a),cb=cellsOf(b);const list=[];
  ca.slice(-2).forEach((cell,k)=>list.push({uid:au,i:ca.length-2+k,cell}));cb.slice(0,2).forEach((cell,i)=>list.push({uid:bu,i,cell}));
  playCells(list.filter(x=>x.i>=0));}
function fixJoint(au,bu){
  // 評估所有修法，兩個接點（舊→新、新→舊）都要順，取最好的一個
  const a=pOf(au),b=pOf(bu),ca=cellsOf(a),cb=cellsOf(b),last=ca[ca.length-1],first=cb[0],y=first.chords[0];if(!y||!last.chords.length)return;
  const x=last.chords[last.chords.length-1],before=ca.length>1?ca[ca.length-2]:null;
  const pre=last.chords.length>1?last.chords[0]:(before&&before.chords.length?before.chords[before.chords.length-1]:prevChordBefore(pIdx(au)));
  const nx=first.chords.length>1?first.chords[1]:(cb[1]&&cb[1].chords[0])||null;
  const pool=[];Object.keys(LIB).forEach(id=>pool.push(inst(id)));
  if(y.lib!=='I'&&!(y.lib&&LIB[y.lib].type==='sec')){const r=mod(y.r+7);pool.push({r,q:'7',roman:'V/'+romanOf(y),f:'D',res:y.r,vi:0,flat:[1,3,8,10].includes(r)||undefined});}
  const nm=c=>chordName(c),opts=[];
  const consider=(links,cost,apply,msg)=>{const mn=Math.min(...links),sum=links.reduce((p,q)=>p+q,0);opts.push({mn,score:mn*2+sum*.5-cost,apply,msg});};
  pool.forEach(Y=>{
    if(diffOf(Y)>=9)return;const dia=kindOf(Y)==='dia'?.5:0;
    // 1) 在前一段最後一小節後半插入 Y：x → Y → y
    if(!last.locked&&last.chords.length===1&&!same(Y,x)&&!same(Y,y))consider([T(x,Y),T(Y,y)],.3-dia,()=>{last.chords=[x,Y];},`在 ${partName(a)} 最後一小節後半加了 ${nm(Y)}：${nm(x)} → ${nm(Y)} → ${nm(y)}`);
    // 2) 換掉前一段最後一個和弦：pre → Y → y
    if(!last.locked&&!same(Y,x))consider([pre?T(pre,Y):3,T(Y,y)],1.5-dia,()=>{last.chords[last.chords.length-1]=Y;},`把 ${partName(a)} 最後的 ${nm(x)} 換成 ${nm(Y)}`);
    // 3) 換掉下一段第一個和弦：x → Y → nx
    if(!first.locked&&!same(Y,y))consider([T(x,Y),nx?T(Y,nx):3],3-dia,()=>{first.chords[0]=Y;},`把 ${partName(b)} 開頭的 ${nm(y)} 換成 ${nm(Y)}`);
  });
  opts.sort((p,q)=>q.score-p.score);
  const best=opts.find(o=>o.mn>=3)||opts.find(o=>o.mn>=2);
  if(!best){toast('兩邊的小節都鎖定了，先解除鎖定再修正');return;}
  const snap=JSON.stringify([a.options,b.options]);
  best.apply();undo=()=>{const [oa,ob]=JSON.parse(snap);a.options=oa;b.options=ob;};
  renderScore();save();toast(best.msg+(best.mn>=3?'':'（只能改善到「可以」）'),'復原');
}


/* ---------- 哼唱錄音 → 和弦 ---------- */
const KMAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],KMIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
let rec={notes:null,bpmUsed:80,tune:0,buf:null,pitch:null,name:'',key:0,detKey:0,detMinor:false,bpm:80,offset:0,type:'verse',opts:[],sel:0,start:0,bars:0,fitW:[],busy:false,err:''};
function fitScore(c,w){
  if(!w)return 0;const S=tones(c);
  if(Array.isArray(w)){let tot=0;for(let k=0;k<12;k++)tot+=w[k];if(tot<1e-6)return 0;let inn=0;S.forEach(pc=>{inn+=w[pc];});return (inn-.7*(tot-inn)+.25*w[mod(c.r)])/tot-(kindOf(c)==='dia'?0:.08);}
  // 重拍上的長音（c）必須是和弦音；弱拍短音（l）可能是經過音，幾乎不扣分
  let tot=0,sc=0;for(let k=0;k<12;k++){const cw=w.c[k],lw=w.l[k];tot+=cw+lw;sc+=S.includes(k)?cw+.5*lw:-cw-.15*lw;}
  if(tot<1e-6)return 0;return (sc+.1*(w.c[mod(c.r)]+w.l[mod(c.r)]))/tot-(kindOf(c)==='dia'?0:.08);
}
function halfFit(c,arr){let tot=0,sc=0;const S=tones(c);for(let k=0;k<12;k++){tot+=arr[k];sc+=S.includes(k)?arr[k]:-.6*arr[k];}return tot<1e-6?0:sc/tot;}
const FITCANDS=()=>Object.keys(LIB).filter(id=>LIB[id].type!=='sec').map(id=>inst(id));
function refineFit(cells,W,prevEnd,nextStart){
  // 前後半小節差很多時拆成兩個和弦；吻合度低的小節標記「?」
  const C=FITCANDS();
  cells.forEach((cell,b)=>{const w=W[b];if(!w||Array.isArray(w)||cell.locked)return;const X=cell.chords[0],h=w.h;
    const s0=h[0].reduce((a,v)=>a+v,0),s1=h[1].reduce((a,v)=>a+v,0);
    if(s0>0&&s1>0&&cell.chords.length===1){
      const P=b>0?cells[b-1].chords[cells[b-1].chords.length-1]:prevEnd,N=b<cells.length-1?cells[b+1].chords[0]:nextStart;
      let A=null,B=null,fa=-9,fb=-9;
      C.forEach(c=>{const a1=halfFit(c,h[0])-(P&&T(P,c)<2?1:0);if(a1>fa){fa=a1;A=c;}const b1=halfFit(c,h[1])-(N&&T(c,N)<2?1:0);if(b1>fb){fb=b1;B=c;}});
      const fX=(halfFit(X,h[0])+halfFit(X,h[1]))/2;
      if(A&&B&&!same(A,B)&&T(A,B)>=2.5&&(fa+fb)/2-fX>.45)cell.chords=[same(A,X)?X:JSON.parse(JSON.stringify(A)),same(B,X)?X:JSON.parse(JSON.stringify(B))];
    }
    const f=cell.chords.length>1?(halfFit(cell.chords[0],h[0])+halfFit(cell.chords[1],h[1]))/2:fitScore(cell.chords[0],w);
    cell.unsure=(s0+s1)>0&&f<.2;});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function yin(x,SR,onProg){
  const W=512,hop=256,tmin=Math.floor(SR/900),tmax=Math.floor(SR/70),n=Math.max(0,Math.floor((x.length-W-tmax)/hop));
  const rms=new Float32Array(n);let maxR=0;
  for(let k=0;k<n;k++){const s=k*hop;let e=0;for(let j=0;j<W;j++)e+=x[s+j]*x[s+j];rms[k]=Math.sqrt(e/W);if(rms[k]>maxR)maxR=rms[k];}
  const gate=Math.max(.006,maxR*.1),d=new Float32Array(tmax+2),raw=new Array(n).fill(null);
  for(let k=0;k<n;k++){
    if(k%120===0){onProg(k/n);await sleep(0);}
    if(rms[k]<gate)continue;const s=k*hop;let run=0,found=-1;d[0]=1;
    for(let tau=1;tau<=tmax+1;tau++){let sum=0;for(let j=0;j<W;j++){const df=x[s+j]-x[s+j+tau];sum+=df*df;}run+=sum;d[tau]=run>0?sum*tau/run:1;}
    for(let tau=tmin;tau<=tmax;tau++){if(d[tau]<.15){while(tau<tmax&&d[tau+1]<d[tau])tau++;found=tau;break;}}
    if(found<0)continue;
    const a=d[found-1],b=d[found],c2=d[found+1],den=a+c2-2*b,sh=den?.5*(a-c2)/den:0,f=SR/(found+sh);
    if(f>65&&f<1000)raw[k]=69+12*Math.log2(f/440);
  }
  const m=raw.map((_,i)=>{const v=[];for(let j=i-2;j<=i+2;j++)if(j>=0&&j<n&&raw[j]!==null)v.push(raw[j]);if(v.length<3||raw[i]===null)return null;v.sort((p,q)=>p-q);return v[v.length>>1];});
  return {m,rms:Array.from(rms),hop:hop/SR,t0:W/2/SR};
}
function notesFromPitch(){
  // 先估整體音準偏差，再把連續的音高合成音符；太短的音（滑音、裝飾音）丟掉
  const P=rec.pitch,fr=[];P.m.forEach(x=>{if(x!==null)fr.push(x-Math.round(x));});fr.sort((a,b)=>a-b);
  const off=fr.length?fr[fr.length>>1]:0;rec.tune=off;
  const notes=[],tf=i=>P.t0+i*P.hop;let cur=null;
  const end=c=>{const dur=(c.last-c.i0+1)*P.hop;if(dur<.09)return;const v=c.vals.slice().sort((a,b)=>a-b);notes.push({t:tf(c.i0),d:dur,p:Math.round(v[v.length>>1])});};
  const R=P.rms||[];
  P.m.forEach((x,i)=>{if(x===null){if(cur)end(cur);cur=null;return;}const y=x-off,r=R[i]||0;
    // 同一個音高但音量先掉再起來（重新咬字），視為新的音
    const reattack=cur&&cur.dip&&r>cur.dipV*1.6&&r>cur.peak*.6;
    if(cur&&Math.abs(y-cur.ref)<.6&&!reattack){cur.vals.push(y);cur.ref=cur.ref*.8+y*.2;cur.last=i;if(r>cur.peak)cur.peak=r;if(r<cur.peak*.55){if(!cur.dip||r<cur.dipV){cur.dip=true;cur.dipV=r;}}}
    else{if(cur){if(reattack)cur.last=i-1;end(cur);}cur={i0:i,last:i,vals:[y],ref:y,peak:r,dip:false,dipV:r};}});
  if(cur)end(cur);
  return notes;
}
function detectKey(){
  const h=new Array(12).fill(0);rec.notes.forEach(n=>{h[mod(n.p)]+=n.d;});
  const corr=(prof,r)=>{let mx=0,my=0;for(let i=0;i<12;i++){mx+=h[i];my+=prof[i];}mx/=12;my/=12;let a=0,b=0,c=0;for(let i=0;i<12;i++){const x=h[mod(i+r)]-mx,y=prof[i]-my;a+=x*y;b+=x*x;c+=y*y;}return a/Math.sqrt((b*c)||1);};
  let best={s:-9,k:0,minor:false};for(let r=0;r<12;r++){const s1=corr(KMAJ,r),s2=corr(KMIN,r);if(s1>best.s)best={s:s1,k:r,minor:false};if(s2>best.s)best={s:s2,k:mod(r+3),minor:r};}
  rec.detKey=best.k;rec.detMinor=best.minor;rec.key=best.k;
}
function barWeights(notes,start,beat,bars,key){
  const z=()=>new Array(12).fill(0);
  const W=Array.from({length:bars},()=>({c:z(),l:z(),h:[z(),z()]}));let hits=0,tot=0;
  notes.forEach(n=>{
    const pos=(n.t-start)/beat,gb=Math.round(pos),onBeat=Math.abs(pos-gb)<.22,b=Math.floor((onBeat?gb:pos)/4),inBar=(onBeat?gb:pos)-4*b,bi=mod2(gb,4);
    const strength=onBeat?(bi===0?2:bi===2?1.2:.8):.4,db=Math.min(n.d/beat,2),w=strength*db,pc=mod(n.p-key);
    tot+=db;if(onBeat&&(bi===0||bi===2))hits+=db;
    if(b>=0&&b<bars){const core=onBeat&&((bi===0&&db>=.75)||(bi===2&&db>=1.5));(core?W[b].c:W[b].l)[pc]+=w;W[b].h[inBar<2?0:1][pc]+=w;}
    const endPos=pos+n.d/beat,nbs=4*(b+1);
    if(endPos>nbs+.25&&b+1>=0&&b+1<bars){const ov=Math.min(endPos-nbs,2);W[b+1].c[pc]+=1.2*ov;W[b+1].h[0][pc]+=1.2*ov;}
  });
  return {W,align:tot?hits/tot:0};
}
function barsFor(start,beat){const n=rec.notes,l=n[n.length-1];return clamp(Math.ceil((l.t+l.d-start)/(4*beat)-.1),1,32);}
function autoAlign(){
  // 試不同的起拍位置（處理弱起）與 ±6% 速度，挑和弦最吻合、重拍最對得上音符的組合
  const notes=rec.notes;if(!notes.length)return;const C=FITCANDS();let best=null;
  for(let fi=-6;fi<=6;fi++)for(let off=-3.5;off<=3.5;off+=.5){const f=1+fi*.01;
    const bpm=rec.bpm*f,beat=60/bpm,start=notes[0].t+off*beat,bars=barsFor(start,beat);
    const {W,align}=barWeights(notes,start,beat,bars,rec.key);
    let fs=0;W.forEach(w=>{let m=-9;C.forEach(c=>{const v=fitScore(c,w);if(v>m)m=v;});fs+=m;});
    const lost=notes.filter(n=>n.t+n.d<=start).reduce((a,n)=>a+n.d,0);
    // 第一小節幾乎沒音 → 應該是弱起，不要多開一小節
    const firstBar=notes.reduce((a,n)=>{const p0=(n.t-start)/beat;return a+(p0>=0&&p0<4?Math.min(n.d/beat,4-p0):0);},0);
    const prior=off===0?.12:(off>0&&off<=1.5)?.06:(off<0&&off>=-1)?.03:Math.abs(off)>2?-.1:0;
    const sc=fs/bars+.6*align-lost*.15-Math.abs(f-1)*1.5+prior-(firstBar<1.5?.25:0);
    if(!best||sc>best.sc)best={sc,f,off,bpm};
  }
  rec.offset=best.off;rec.bpmUsed=Math.round(best.bpm);
}
function analyzeRec(){
  if(!rec.notes||!rec.notes.length){rec.err='錄音裡沒有偵測到清楚的旋律。請靠近麥克風、用「啦」或「嘟」清楚地哼，避免背景音樂。';rec.opts=[];return;}
  rec.err='';const beat=60/rec.bpmUsed;
  rec.start=rec.notes[0].t+rec.offset*beat;rec.bars=barsFor(rec.start,beat);
  const {W}=barWeights(rec.notes,rec.start,beat,rec.bars,rec.key);rec.fitW=W;
  const any=Object.keys(LIB).filter(id=>LIB[id].type!=='sec'),sec={len:rec.bars,t:[2,2.5],end:any};
  const runs=[];[0,.5,.5].forEach(temp=>{const b=beam(sec,{w:weightFn(state.mood,''),start:any,prevEnd:null,nextStart:null,locked:[],temp,fit:W});if(b)runs.push(...b.slice(0,8));});
  runs.sort((a,b)=>b.clean-a.clean);
  rec.opts=diverse(runs,3).map(r=>{const cells=r.path.map(c=>({chords:JSON.parse(JSON.stringify(c.chords)),locked:false,lyric:''}));refineFit(cells,W,null,null);return cells;});rec.sel=0;
}
function recKeyName(k){return (FLATKEYS.has(k)?NOTE_F:NOTE_S)[k];}
function chordNameIn(c,k){const pc=mod(k+c.r);return (prefOf(c,k)==='flat'?NOTE_F:NOTE_S)[pc]+Q[c.q].suf;}
function openRec(){document.getElementById('recDlg').hidden=false;document.body.style.overflow='hidden';rec.bpm=rec.buf?rec.bpm:state.bpm;renderRec();}
function closeRec(){stopMetro();stopAll();document.getElementById('recDlg').hidden=true;document.body.style.overflow='';}
function renderRec(){
  const pn=document.getElementById('recPn');
  pn.innerHTML=`<div class="sh-top"><div class="t">從哼唱錄音產生和弦</div><button type="button" class="btn sm" data-act="recclose">關閉</button></div>
  <ol class="steps">
    <li>按下方「節拍器」，用手機的錄音 App 跟著拍子哼唱一段旋律（用「啦」或「嘟」，8 小節左右最好）。</li>
    <li>把錄音檔上傳到這裡，速度設成跟節拍器一樣。</li>
    <li>聽聽看「錄音＋和弦」，選一個方案加入譜中。</li></ol>
  <div class="row">
    <label class="f" for="recBpm" style="flex:0 0 auto">速度（BPM）<input id="recBpm" type="number" min="50" max="190" value="${rec.bpm}" style="width:90px"></label>
    <button type="button" class="btn" data-act="metro" id="metroBtn">${metro?'■ 停止節拍器':'▶ 節拍器'}</button>
    <label class="f" for="recType" style="flex:0 0 auto">放進哪種段落<select id="recType">${SECS.map(s=>`<option value="${s.id}"${s.id===rec.type?' selected':''}>${s.name}</option>`).join('')}</select></label>
  </div>
  <label class="f" for="recFile">錄音檔（m4a、mp3、wav，2 分鐘以內）<input id="recFile" type="file" accept="audio/*"></label>
  <div id="recRes" aria-live="polite"></div>`;
  renderRecResult();
}
function renderRecResult(){
  const box=document.getElementById('recRes');if(!box)return;
  if(rec.busy){box.innerHTML=`<p class="hint" id="recProg">分析中…</p>`;return;}
  if(!rec.pitch){box.innerHTML=rec.err?`<p class="hint warnt">${esc(rec.err)}</p>`:'';return;}
  if(rec.err){box.innerHTML=`<p class="hint warnt">${esc(rec.err)}</p>`;return;}
  const kn=recKeyName(rec.key);
  const o0=rec.opts[rec.sel]||[],uns=o0.filter(c=>c.unsure).length;
  const startTxt=rec.offset>0?`弱起 ${rec.offset} 拍`:rec.offset<0?`從第 ${1-rec.offset} 拍開始唱`:'從第 1 拍開始唱';
  box.innerHTML=`<p class="hint">${esc(rec.name)} · 偵測到 <b>${recKeyName(rec.detKey)} 大調</b>${rec.detMinor!==false?`（聽起來像 ${NOTE_S[rec.detMinor]} 小調，和弦一樣用 ${recKeyName(rec.detKey)} 大調的系統）`:''} · ${rec.bars} 小節<br>
    自動對齊：${startTxt}、速度 ${rec.bpmUsed}${rec.bpmUsed!==rec.bpm?`（你設 ${rec.bpm}，自動微調）`:''}${Math.abs(rec.tune)>.15?` · 整體音準偏${rec.tune>0?'高':'低'} ${Math.round(Math.abs(rec.tune)*100)} 音分，已校正`:''}</p>
  <div class="row">
    <label class="f" for="recKey" style="flex:0 0 auto">調<select id="recKey">${KEYS.map(([n,p])=>`<option value="${p}"${p===rec.key?' selected':''}>${n} 大調</option>`).join('')}</select></label>
    <label class="f" for="recOff" style="flex:1;min-width:180px">起拍位置（${startTxt}）<input id="recOff" type="range" min="-3.5" max="3.5" step="0.5" value="${rec.offset}"></label>
    <button type="button" class="btn" data-act="recalign">↻ 自動對齊</button><button type="button" class="btn" data-act="recplay">▶ 只聽錄音</button></div>
  <div class="roll"><canvas id="recCanvas" height="150" aria-label="偵測到的旋律與小節"></canvas></div>
  <p class="hint">粗直線是小節線，綠色長條是偵測到的音符，紅底是旋律跟和弦不太吻合的小節${uns?`（目前方案有 ${uns} 小節，加入譜中後會標「?」）`:''}。若整體對不上，調整速度或起拍位置。</p>
  <div class="cands">${rec.opts.map((o,k)=>`<div class="cand${k===rec.sel?' sel':''}"><div class="m"><button type="button" class="pickbtn" data-act="recpick" data-k="${k}" aria-pressed="${k===rec.sel}">方案 ${k+1}</button>
    <div class="nm" style="font-size:16px">${o.map(c=>c.chords.map(x=>esc(chordNameIn(x,rec.key))).join('/')+(c.unsure?'?':'')).join(' · ')}</div></div>
    <div class="a"><button type="button" class="btn sm" data-act="recplay" data-k="${k}">▶ 錄音＋和弦</button></div></div>`).join('')}</div>
  <div class="row"><button type="button" class="btn pri" data-act="recapply">把方案 ${rec.sel+1} 加入譜中</button>
    <span class="hint">${rec.key!==state.key&&state.parts.length?`整首歌會改成 ${kn} 大調，其他段落的和弦會一起移調。`:`會改成 ${kn} 大調、速度 ${rec.bpmUsed}。`}${rec.bars>16?'超過 16 小節，會拆成每 8 小節一段。':''}</span></div>`;
  drawRoll();
}
function drawRoll(){
  const cv=document.getElementById('recCanvas');if(!cv)return;const wrap=cv.parentElement;
  const N=rec.notes,beat=60/rec.bpmUsed,bar=4*beat,t0=Math.min(rec.start,N[0].t)-beat*.5,t1=rec.start+rec.bars*bar;
  const cssW=Math.max(wrap.clientWidth,rec.bars*90),cssH=150,dpr=window.devicePixelRatio||1;
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';cv.width=cssW*dpr;cv.height=cssH*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);const st=getComputedStyle(document.documentElement),col=v=>st.getPropertyValue(v).trim();
  let lo=99,hi=0;N.forEach(n=>{lo=Math.min(lo,n.p);hi=Math.max(hi,n.p);});lo-=2;hi+=2;
  const X=t=>(t-t0)/(t1-t0)*cssW,Y=m=>cssH-10-(m-lo)/(hi-lo||1)*(cssH-38);
  g.clearRect(0,0,cssW,cssH);
  const o=rec.opts[rec.sel]||[];
  o.forEach((c,b)=>{if(c.unsure){g.fillStyle=col('--fD');g.globalAlpha=.12;g.fillRect(X(rec.start+b*bar),22,X(rec.start+(b+1)*bar)-X(rec.start+b*bar),cssH-22);g.globalAlpha=1;}});
  for(let mm=lo;mm<=hi;mm++){if([0,2,4,5,7,9,11].includes(mod(mm-rec.key))){g.fillStyle=col('--sunk');g.fillRect(0,Y(mm)-2,cssW,4);}}
  for(let b=0;b<=rec.bars*4;b++){const x=X(rec.start+b*beat);g.strokeStyle=b%4===0?col('--ink'):col('--line');g.lineWidth=b%4===0?1.4:1;g.beginPath();g.moveTo(x,22);g.lineTo(x,cssH);g.stroke();}
  g.fillStyle=col('--accent');N.forEach(n=>{const x0=X(n.t),x1=X(n.t+n.d);g.fillRect(x0,Y(n.p)-3,Math.max(2,x1-x0-1),6);});
  g.fillStyle=col('--ink');g.font='700 14px Kalam, "Noto Sans TC", sans-serif';
  o.forEach((c,b)=>{c.chords.forEach((ch,j)=>{g.fillText(chordNameIn(ch,rec.key),X(rec.start+b*bar+j*bar/c.chords.length)+4,16);});});
}
async function onRecFile(file){
  if(!file)return;rec.busy=true;rec.err='';rec.pitch=null;rec.name=file.name;renderRecResult();
  try{
    const c=ac();const buf=await c.decodeAudioData(await file.arrayBuffer());
    if(buf.duration>125)throw new Error('long');
    rec.buf=buf;const SR=16000,off=new OfflineAudioContext(1,Math.ceil(buf.duration*SR),SR),s=off.createBufferSource();s.buffer=buf;s.connect(off.destination);s.start();
    const r=await off.startRendering();
    rec.pitch=await yin(r.getChannelData(0),SR,f=>{const el=document.getElementById('recProg');if(el)el.textContent=`分析中… ${Math.round(f*100)}%`;});
    rec.notes=notesFromPitch();rec.busy=false;
    if(!rec.notes.length){rec.err='錄音裡沒有偵測到清楚的旋律。請靠近麥克風、用「啦」或「嘟」清楚地哼，避免背景音樂。';rec.pitch=null;}
    else{detectKey();autoAlign();analyzeRec();}
  }catch(e){rec.busy=false;rec.pitch=null;rec.err=e&&e.message==='long'?'錄音超過 2 分鐘，請剪短一點再上傳。':'這個檔案讀不出來，請換成 m4a、mp3 或 wav。';}
  renderRecResult();
}
function playRec(opt){
  stopAll();if(!rec.buf)return;const c=ac();playing=true;document.getElementById('playAll').textContent='■ 停止';
  const beat=60/rec.bpmUsed,bar=4*beat,now=c.currentTime;
  // 從第一個音（或第一小節）前 0.3 秒開始播錄音，和弦從第一小節開始
  const offset=Math.max(0,Math.min(rec.start,rec.notes[0].t)-.3),when=now+.15,T0=when+(rec.start-offset);
  const src=c.createBufferSource();src.buffer=rec.buf;const g=c.createGain();g.gain.value=.9;src.connect(g);g.connect(c.destination);
  src.start(when,offset);sources.push(src);
  const sk=state.key;state.key=rec.key;
  if(opt)opt.forEach((cell,b)=>{const n=cell.chords.length;cell.chords.forEach((ch,j)=>{const st=T0+b*bar+j*bar/n;playChord(ch,st,bar/n/2,.6,false);playChord(ch,st+bar/n/2,bar/n/2,.45,false);});});
  state.key=sk;
  const endT=opt?T0+rec.bars*bar:when+rec.buf.duration-offset;
  timers.push(setTimeout(stopAll,(endT-now+.4)*1000));
}
function applyRec(){
  const o0=rec.opts;if(!o0.length)return;
  const keyChanged=state.parts.length&&rec.key!==state.key;
  state.key=rec.key;state.bpm=rec.bpmUsed;
  const n=rec.bars,chunks=[];if(n>16){for(let a=0;a<n;a+=8)chunks.push([a,Math.min(n,a+8)]);}else chunks.push([0,n]);
  chunks.forEach(([a,b])=>state.parts.push({uid:newUid(),type:rec.type,len:b-a,mood:'',pick:rec.sel,
    options:o0.map(o=>o.slice(a,b).map(c=>({chords:JSON.parse(JSON.stringify(c.chords)),locked:false,lyric:'',unsure:!!c.unsure}))),fit:rec.fitW.slice(a,b)}));
  closeRec();renderAll();
  const first=document.getElementById('part-'+state.parts[state.parts.length-chunks.length].uid);if(first)first.scrollIntoView({block:'start'});
  toast(`已加入 ${chunks.length} 個段落${keyChanged?`，整首歌改成 ${recKeyName(rec.key)} 大調`:''}`);
}
let metro=null;
function toggleMetro(){if(metro){stopMetro();}else{const c=ac();let next=c.currentTime+.1,k=0;const bpmNow=()=>clamp(+document.getElementById('recBpm').value||rec.bpm,50,190);
  const tick=()=>{while(next<c.currentTime+.25){const o=c.createOscillator(),g=c.createGain();o.frequency.value=k%4===0?1500:1000;g.gain.setValueAtTime(.0001,next);g.gain.exponentialRampToValueAtTime(.5,next+.002);g.gain.exponentialRampToValueAtTime(.0001,next+.06);o.connect(g);g.connect(c.destination);o.start(next);o.stop(next+.08);next+=60/bpmNow();k++;}};
  tick();metro=setInterval(tick,60);}
  const b=document.getElementById('metroBtn');if(b)b.textContent=metro?'■ 停止節拍器':'▶ 節拍器';}
function stopMetro(){if(metro){clearInterval(metro);metro=null;}const b=document.getElementById('metroBtn');if(b)b.textContent='▶ 節拍器';}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='recFile')onRecFile(t.files[0]);
  else if(t.id==='recBpm')setRecBpm(t);
  else if(t.id==='recType')rec.type=t.value;
  else if(t.id==='recOff'){rec.offset=+t.value;if(rec.notes)analyzeRec();renderRecResult();const r=document.getElementById('recOff');if(r)r.focus();}
  else if(t.id==='recKey'){rec.key=+t.value;if(rec.notes){autoAlign();analyzeRec();}renderRecResult();}
});
let bpmT=null;
function setRecBpm(t){clearTimeout(bpmT);const v=clamp(+t.value||80,50,190);if(v===rec.bpm)return;rec.bpm=v;if(rec.notes&&rec.notes.length){autoAlign();analyzeRec();renderRecResult();}}
document.addEventListener('input',e=>{if(e.target.id==='recBpm'){const t=e.target;clearTimeout(bpmT);if(+t.value>=50&&+t.value<=190)bpmT=setTimeout(()=>setRecBpm(t),500);}
  if(e.target.id==='recOff'){const l=e.target.closest('label');const v=+e.target.value;if(l&&l.firstChild)l.firstChild.textContent=`起拍位置（${v>0?`弱起 ${v} 拍`:v<0?`從第 ${1-v} 拍開始唱`:'從第 1 拍開始唱'}）`;}});
window.addEventListener('resize',()=>{if(!document.getElementById('recDlg').hidden)drawRoll();});

/* ---------- 開始 ---------- */
load();renderAddBtns();renderAll();
</script>
